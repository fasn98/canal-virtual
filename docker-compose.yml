services:
  redis:
    image: redis:7
    container_name: redis
    restart: always
    networks:
      - canalnet

  collector:
    build: ./collector
    container_name: collector
    restart: always
    networks:
      - canalnet
    environment:
      - PYTHONUNBUFFERED=1
      - BBC_FEED_URLS=${BBC_FEED_URLS}
      - GUARDIAN_API_KEY=
      - GUARDIAN_SECTIONS=
      - AGENCIABRASIL_FEED_URLS=${AGENCIABRASIL_FEED_URLS}
      - POLL_INTERVAL_SEC=${POLL_INTERVAL_SEC}
    depends_on:
      - redis

  classifier:
    build: ./classifier
    container_name: classifier
    restart: always
    networks:
      - canalnet
    environment:
      - PYTHONUNBUFFERED=1
      - DEEPL_API_KEY=${DEEPL_API_KEY}
      - TARGET_LANGUAGE=${TARGET_LANGUAGE}
      - PT_NATIVE_SOURCES=${PT_NATIVE_SOURCES:-Agência Brasil}
      - DEEPL_TIMEOUT_SEC=10
      - STUCK_MESSAGE_TIMEOUT_MS=60000
      - MAX_DELIVERY_ATTEMPTS=3
      - STUCK_SCAN_INTERVAL_SEC=30
    depends_on:
      - redis
      - collector

  commentator:
    build: ./commentator
    container_name: commentator
    restart: always
    networks:
      - canalnet
    environment:
      - PYTHONUNBUFFERED=1
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_WORKSPACE_ID=${ANTHROPIC_WORKSPACE_ID}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL}
      - TARGET_COMMENTARY_WORDS=${TARGET_COMMENTARY_WORDS}
      - ENABLE_EDITORIAL_REVIEW=true
      - MAX_CORRECTION_ATTEMPTS=2
      - STUCK_MESSAGE_TIMEOUT_MS=60000
      - MAX_DELIVERY_ATTEMPTS=3
      - STUCK_SCAN_INTERVAL_SEC=30
    depends_on:
      - redis
      - classifier

  promoter:
    build: ./promoter
    container_name: promoter
    restart: always
    networks:
      - canalnet
    environment:
      - PYTHONUNBUFFERED=1
      - NEWS_PER_PROMO=${NEWS_PER_PROMO}
      - ENABLE_ENGAGEMENT_BOT=false
      - YOUTUBE_OAUTH_CLIENT_ID=${YOUTUBE_OAUTH_CLIENT_ID}
      - YOUTUBE_OAUTH_CLIENT_SECRET=${YOUTUBE_OAUTH_CLIENT_SECRET}
      - YOUTUBE_OAUTH_REFRESH_TOKEN=${YOUTUBE_OAUTH_REFRESH_TOKEN}
      - YOUTUBE_LIVE_VIDEO_ID=${YOUTUBE_LIVE_VIDEO_ID}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_WORKSPACE_ID=${ANTHROPIC_WORKSPACE_ID}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL}
    depends_on:
      - redis
      - renderer

  # "O Mundo em 3 Minutos" (Short vertical 3x/dia). NÃO sobe no `up` normal:
  # profile "worldin3". Loop de agendamento:
  #   docker compose --profile worldin3 up -d worldin3
  # Execução manual de uma edição:
  #   docker compose run --rm worldin3 python -m worldin3.run_once generate
  #   docker compose run --rm worldin3 python -m worldin3.run_once upload-last
  worldin3:
    build:
      context: .
      dockerfile: worldin3/Dockerfile
    container_name: worldin3
    profiles: ["worldin3"]
    restart: unless-stopped
    networks:
      - canalnet
    command: ["python", "-m", "worldin3.scheduler", "--loop"]
    environment:
      - PYTHONUNBUFFERED=1
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_WORKSPACE_ID=${ANTHROPIC_WORKSPACE_ID}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL}
      # Revisão editorial DESLIGADA no worldin3 por decisão de produto (01/09):
      # o encerramento do resumo tem CTA de like/inscrição (WORLDIN3_CLOSING_CTA),
      # que os 3 revisores barram como "linguagem de rede social". A base factual
      # do resumo é o comentário por manchete, que já passou pelos 3 revisores
      # quando cada notícia rodou sozinha (ver worldin3/reviewbridge.py).
      - ENABLE_EDITORIAL_REVIEW=false
      - MAX_CORRECTION_ATTEMPTS=2
      - WORLDIN3_CLOSING_CTA=${WORLDIN3_CLOSING_CTA:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID}
      - ELEVENLABS_MODEL_ID=${ELEVENLABS_MODEL_ID}
      # OAuth: MESMO client do bot de chat, refresh token SEPARADO (escopo upload)
      - YOUTUBE_OAUTH_CLIENT_ID=${YOUTUBE_OAUTH_CLIENT_ID}
      - YOUTUBE_OAUTH_CLIENT_SECRET=${YOUTUBE_OAUTH_CLIENT_SECRET}
      - YOUTUBE_OAUTH_REFRESH_TOKEN_UPLOAD=${YOUTUBE_OAUTH_REFRESH_TOKEN_UPLOAD}
      - YOUTUBE_CHANNEL_HANDLE=${YOUTUBE_CHANNEL_HANDLE}
      # Agendamento / edição
      - WORLDIN3_SCHEDULE_TIMES=${WORLDIN3_SCHEDULE_TIMES:-08:00,14:00,20:00}
      - WORLDIN3_SCHEDULE_TZ=${WORLDIN3_SCHEDULE_TZ:-America/Sao_Paulo}
      - WORLDIN3_PRIVACY_STATUS=${WORLDIN3_PRIVACY_STATUS:-unlisted}
      - WORLDIN3_PLAYLIST_ID=${WORLDIN3_PLAYLIST_ID:-}
      - WORLDIN3_LIVE_URL=${WORLDIN3_LIVE_URL:-}
      - WORLDIN3_DAILY_CREDIT_BUDGET=${WORLDIN3_DAILY_CREDIT_BUDGET:-12000}
      # TubeOptimizer (NUNCA automático; só via run_once.py tubeoptimizer)
      - WORLDIN3_ENABLE_TUBEOPTIMIZER=${WORLDIN3_ENABLE_TUBEOPTIMIZER:-false}
      - WORLDIN3_TUBEOPTIMIZER_CONTENT_LINE=${WORLDIN3_TUBEOPTIMIZER_CONTENT_LINE:-futurenews}
      - TUBEOPTIMIZER_BASE_URL=${TUBEOPTIMIZER_BASE_URL:-}
      - TUBEOPTIMIZER_API_KEY=${TUBEOPTIMIZER_API_KEY:-}
    volumes:
      - ./volumes/assets:/app/assets
      - ./volumes/output:/app/output
    depends_on:
      - redis

  synthesizer:
    build: ./synthesizer
    container_name: synthesizer
    restart: always
    networks:
      - canalnet
    environment:
      - PYTHONUNBUFFERED=1
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID}
      - ELEVENLABS_MODEL_ID=${ELEVENLABS_MODEL_ID}
      - DAILY_CREDIT_BUDGET=${DAILY_CREDIT_BUDGET}
      - STUCK_MESSAGE_TIMEOUT_MS=60000
      - MAX_DELIVERY_ATTEMPTS=3
      - STUCK_SCAN_INTERVAL_SEC=30
    depends_on:
      - redis
      - commentator
    volumes:
      - ./volumes/assets:/app/assets

  renderer:
    build:
      context: .
      dockerfile: renderer/Dockerfile
    container_name: renderer
    restart: always
    networks:
      - canalnet
    environment:
      - PYTHONUNBUFFERED=1
      - ENABLE_LIPSYNC=false
      - AVATAR_PROVIDER=${AVATAR_PROVIDER:-d-id}
      - GPU_LIPSYNC_REAL=${GPU_LIPSYNC_REAL:-false}
      - GPU_SERVER_URL=${GPU_SERVER_URL:-}
      - INFERENCE_SERVER_API_KEY=${INFERENCE_SERVER_API_KEY:-}
      - GENERATE_TIMEOUT_SEC=${GENERATE_TIMEOUT_SEC:-1800}
      # Controle DIRETO do pod na API do RunPod (2026-09-05) — o app Replit
      # não entra mais no liga/desliga, só RUNPOD_API_KEY/RUNPOD_POD_ID.
      - RUNPOD_API_KEY=${RUNPOD_API_KEY:-}
      - RUNPOD_POD_ID=${RUNPOD_POD_ID:-}
      - GPU_POD_PORT=${GPU_POD_PORT:-8000}
      - GPU_START_TIMEOUT_SEC=${GPU_START_TIMEOUT_SEC:-180}
      - GPU_READY_TIMEOUT_SEC=${GPU_READY_TIMEOUT_SEC:-120}
      # Failover (docs/gpu-failover-plan.md): podResume falho por "not enough
      # free GPUs" -> deploya pod novo no volume. REDIS_HOST persiste o pod
      # ativo (gpu:active_pod_id) entre restarts do renderer.
      - REDIS_HOST=${REDIS_HOST:-redis}
      - GPU_FAILOVER_ENABLED=${GPU_FAILOVER_ENABLED:-true}
      - GPU_MIN_VRAM_GB=${GPU_MIN_VRAM_GB:-20}
      # MuseTalk só atende PRODUÇÃO com este opt-in explícito (além de
      # AVATAR_PROVIDER=musetalk). Sem ele, itens de teste rodam pelo musetalk
      # mas a produção segue pelo caminho D-ID. Falha/QA reprovada no musetalk
      # SEMPRE cai no D-ID (ver renderer/main.py:_render_musetalk_block).
      - MUSETALK_ALLOW_ON_AIR=${MUSETALK_ALLOW_ON_AIR:-false}
      # QA do áudio que volta do pod (vazio => padrão do código; ver .env.example).
      - MUSETALK_QA_ENABLED=${MUSETALK_QA_ENABLED:-true}
      - MUSETALK_QA_CHARS_PER_SEC=${MUSETALK_QA_CHARS_PER_SEC:-}
      - MUSETALK_QA_MIN_RATIO=${MUSETALK_QA_MIN_RATIO:-}
      - MUSETALK_QA_MAX_RATIO=${MUSETALK_QA_MAX_RATIO:-}
      - MUSETALK_QA_MIN_SEC=${MUSETALK_QA_MIN_SEC:-}
      - MUSETALK_QA_MAX_AV_SKEW_SEC=${MUSETALK_QA_MAX_AV_SKEW_SEC:-}
      - MUSETALK_QA_SILENCE_DB=${MUSETALK_QA_SILENCE_DB:-}
      # Chunking do TTS (Chatterbox trunca texto longo): chars por bloco /tts.
      - MUSETALK_TTS_MAX_CHARS=${MUSETALK_TTS_MAX_CHARS:-}
      # Log persistente do ciclo do pod GPU em /app/output/gpu_client.log
      # (volume ./volumes/output). Vazio nesta var desliga.
      - GPU_CLIENT_LOG_MAX_BYTES=${GPU_CLIENT_LOG_MAX_BYTES:-5000000}
      - ALLOW_TEST_ON_AIR=false
      - ENABLE_TV=true
      - ENABLE_TV_YOUTUBE=true
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - YOUTUBE_CHANNEL_HANDLE=${YOUTUBE_CHANNEL_HANDLE}
      - PEXELS_API_KEY=${PEXELS_API_KEY}
      - NEWS_PER_PROMO=${NEWS_PER_PROMO}
      - STUCK_MESSAGE_TIMEOUT_MS=60000
      - MAX_DELIVERY_ATTEMPTS=3
      - STUCK_SCAN_INTERVAL_SEC=30
      # Chroma key do apresentador MuseTalk (renderer/musetalk.py). ENABLED
      # default "false": composição "caixa nativa" atual, sem mudança de
      # comportamento. Calibrar COLOR/SIMILARITY/BLEND contra o idle novo
      # antes de ligar (ver renderer/musetalk.py:compose_presenter_block).
      - MUSETALK_CHROMA_ENABLED=${MUSETALK_CHROMA_ENABLED:-false}
      - MUSETALK_CHROMA_COLOR=${MUSETALK_CHROMA_COLOR:-0x00B140}
      - MUSETALK_CHROMA_SIMILARITY=${MUSETALK_CHROMA_SIMILARITY:-0.14}
      - MUSETALK_CHROMA_BLEND=${MUSETALK_CHROMA_BLEND:-0.06}
      - MUSETALK_CHROMA_DESPILL=${MUSETALK_CHROMA_DESPILL:-true}
      # Enquadramento do apresentador (renderer/musetalk.py). Reajustado
      # 2026-09-06 c/ a bancada: SCALE=0.70 + Y=330 sobem o recorte
      # (cabeça+ombros) até a bancada cobrir a borda reta; X=1080 alinha com o
      # apresentador D-ID. BORDER OFF.
      - MUSETALK_PRESENTER_X=${MUSETALK_PRESENTER_X:-1080}
      - MUSETALK_PRESENTER_Y=${MUSETALK_PRESENTER_Y:-330}
      - MUSETALK_PRESENTER_SCALE=${MUSETALK_PRESENTER_SCALE:-0.70}
      - MUSETALK_PRESENTER_BORDER=${MUSETALK_PRESENTER_BORDER:-false}
      # Bancada curva em 1º plano (assets/studio_desk.png). Aplicada nos DOIS
      # caminhos (D-ID: _render_did_block; MuseTalk: compose_presenter_block).
      # Esconde a borda reta do recorte e ancora a figura em studio_bg_novo.png.
      - STUDIO_DESK_ENABLED=${STUDIO_DESK_ENABLED:-false}
      - STUDIO_DESK_IMG=${STUDIO_DESK_IMG:-studio_desk.png}
      - STUDIO_DESK_Y=${STUDIO_DESK_Y:-0}
    depends_on:
      - synthesizer
      - redis
    volumes:
      - ./volumes/assets:/app/assets
      - ./volumes/output:/app/output
      - ./volumes/ticker:/app/ticker

  streamer:
    build: ./streamer
    container_name: streamer
    restart: always
    networks:
      - canalnet
    environment:
      - RTMP_URL=${RTMP_URL}
      - MUSIC_VOLUME=${MUSIC_VOLUME}
      - VOICE_VOLUME=${VOICE_VOLUME}
    depends_on:
      - renderer
    volumes:
      - ./volumes/output:/app/output
      - ./volumes/assets:/app/assets

  metrics-api:
    build: ./metrics-api
    container_name: metrics-api
    restart: always
    networks:
      - canalnet
    ports:
      - "8090:8090"
    environment:
      - PYTHONUNBUFFERED=1
      - METRICS_API_KEY=${METRICS_API_KEY}
      - DAILY_CREDIT_BUDGET=${DAILY_CREDIT_BUDGET}
      - ENABLE_LIPSYNC=false
      - DID_API_KEY=
      - DID_API_URL=https://api.d-id.com
      - EXPECTED_CONTAINERS=redis,collector,classifier,commentator,promoter,synthesizer,renderer,streamer,metrics-api
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - redis

  # --- Monitor 24h do canal — agente SÓ DE SAÍDA (sem portas) ---------------
  # Reporta um snapshot de saúde + heartbeat para o dashboard /canal hospedado
  # no app Replit (TUBEOPTIMIZER). Nada novo fica exposto na VM: o agente só
  # disca pra fora. Socket do Docker montado rw porque as Fases 2/3 vão
  # reiniciar serviços (nesta Fase 1 o agente só LÊ). Ver docs/canal-monitor-plan.md.
  ops-agent:
    build: ./ops-agent
    container_name: ops-agent
    restart: unless-stopped
    networks:
      - canalnet
    environment:
      - PYTHONUNBUFFERED=1
      # URL raiz do app Replit e segredo compartilhado com o dashboard.
      - CANAL_APP_BASE_URL=${CANAL_APP_BASE_URL:-https://tube-oprtimizer.replit.app}
      - CANAL_OPS_SHARED_SECRET=${CANAL_OPS_SHARED_SECRET}
      # metrics-api interno (mesma chave já usada pelo painel).
      - METRICS_API_URL=http://metrics-api:8090
      - METRICS_API_KEY=${METRICS_API_KEY}
      - REDIS_HOST=redis
      - COMPOSE_PROJECT_NAME=canal-virtual
      - OPS_AGENT_REPORT_INTERVAL_SEC=${OPS_AGENT_REPORT_INTERVAL_SEC:-20}
      # Espelham o worldin3 para calcular o próximo disparo e ler o gasto do dia.
      - WORLDIN3_SCHEDULE_TIMES=${WORLDIN3_SCHEDULE_TIMES:-08:00,14:00,20:00}
      - WORLDIN3_SCHEDULE_TZ=${WORLDIN3_SCHEDULE_TZ:-America/Sao_Paulo}
      - WORLDIN3_DAILY_CREDIT_BUDGET=${WORLDIN3_DAILY_CREDIT_BUDGET:-12000}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./volumes/output:/app/output:ro
    depends_on:
      - redis
      - metrics-api

networks:
  canalnet:
    driver: bridge
